[project]
name = "opret-digital-ansoegning-til-personlige-hjaelpemidler"
version = "0.2.1"
description = "Automatisering der behandler afsluttede XFlow-arbejdsgange for ansøgninger om kropsbårne hjælpemidler og opretter tilhørende sag i KMD Nexus."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "automation-server-client",
    "kmd-nexus-client",
    "odk-tools",
    "openpyxl",
    "ruff>=0.15.11",
    "xflow-client",
]

[tool.uv.sources]
xflow-client = { git = "https://github.com/odense-rpa/xflow-client.git", rev = "master" }
odk-tools = { git = "https://github.com/odense-rpa/odk-tools.git", rev = "master" }
kmd-nexus-client = { git = "https://github.com/odense-rpa/nexus-client.git", rev = "a93da4866c98bc6e8605989359b2db69f8bb5bdb" }
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.2.1" }
